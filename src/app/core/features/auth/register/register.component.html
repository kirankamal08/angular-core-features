<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4 rounded-4" style="max-width: 600px; width: 100%;">
    <h3 class="text-center mb-4">Register</h3>

    <form [formGroup]="RegForm" (ngSubmit)="onSubmmit()">
      <div formGroupName="personalInfo">
        <!-- Fullname -->
        <div class="row mb-3">
          <label for="fullname" class="col-sm-4 col-form-label">Fullname</label>
          <div class="col-sm-8">
            <input appAutofocus
              type="text"
              id="fullname"
              formControlName="fullname"
              class="form-control"
              placeholder="Enter fullname"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="row mb-3">
          <label for="email" class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-control"
              placeholder="Enter email"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="row mb-3">
          <label for="password" class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input
              type="password"
              id="password"
              formControlName="password"
              class="form-control"
              placeholder="Enter password"
            />
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="row mb-3">
          <label for="confirmPassword" class="col-sm-4 col-form-label">Confirm Password</label>
          <div class="col-sm-8">
            <input
              type="password"
              id="confirmPassword"
              formControlName="confirmPassword"
              class="form-control"
              placeholder="Confirm password"
            />
          </div>
        </div>

        <!-- Phone Numbers -->
        <div class="mb-3" formArrayName="phoneNumbers">
          <label class="form-label">Phone Numbers</label>
          <div
            *ngFor="let phone of phoneNumbersF.controls; let i = index"
            [formGroupName]="i"
            class="row g-2 mb-2 align-items-center"
          >
            <div class="col">
              <input
                type="text"
                class="form-control"
                formControlName="number"
                placeholder="Enter phone number"
              />
            </div>
            <div class="col-auto">
              <select class="form-select" formControlName="type">
                <option value="mobile">Mobile</option>
                <option value="work">Work</option>
                <option value="home">Home</option>
              </select>
            </div>
            <div class="col-auto">
              <button
                type="button"
                class="btn btn-outline-danger btn-sm"
                (click)="removePhone(i)"
              >
                ✕
              </button>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-outline-secondary btn-sm mt-2"
            (click)="addPhone()"
          >
            + Add Phone
          </button>
        </div>
      </div>

      <!-- Submit -->
      <div class="d-grid mt-4">
        <button type="submit"  [appButtonDisabledIfInvalid]="RegForm" class="btn btn-primary btn-lg">Submit</button>
      </div>
    </form>
  </div>
</div>
